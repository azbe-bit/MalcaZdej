<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>Prijava - MalcaZdej</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 w-full max-w-md">
        <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Prijava v MalcaZdej</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-xl transition">Prijavi se</button>
        </form>
        <p class="text-center text-sm text-slate-500 mt-4">
            <a href="{% url 'seznam_malic' %}" class="text-emerald-600 hover:underline">Nazaj na domačo stran</a>
        </p>
    </div>
</body>
</html>
