{% extends "base.html" %}
{% block title %}Registracija – MalcaZdej{% endblock %}
{% block content %}
<div class="card form-card">
    <h1>Registracija</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Ustvari račun</button>
    </form>
    <p class="muted">Že imaš račun? <a href="{% url 'login' %}">Prijavi se</a></p>
</div>
{% endblock %}
